  .result-count{ font-size:12px; color:var(--ink-soft); }
  .table-wrap{ background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:auto; max-height:640px; }
  table{ width:100%; border-collapse:collapse; font-size:12px; min-width:1400px; }
  thead th{ position:sticky; top:0; background:#0E2624; text-align:left; padding:9px 7px; font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); border-bottom:1px solid var(--line); white-space:nowrap; font-weight:600; z-index:1; }
  tbody td{ padding:7px; border-bottom:1px solid var(--line); vertical-align:top; }
  tbody tr:hover{ background:#163B36; }
  tbody tr.sev-legal{ border-left:3px solid var(--red); }
  tbody tr.sev-warning{ border-left:3px solid var(--amber); }
  tbody tr.sev-ok{ border-left:3px solid var(--teal); }
  tbody tr.sev-info{ border-left:3px solid var(--blue); }
  tbody tr.sev-neutral{ border-left:3px solid #C7CBC9; }

  .col-num{ text-align:right; font-family:'Courier New',monospace; white-space:nowrap; }
  .baldue{ font-family:'Courier New',monospace; font-weight:600; text-align:right; white-space:nowrap; }
  .baldue.neg{ color:var(--red); }
  .badge{ display:inline-block; font-size:10px; font-weight:600; padding:2px 6px; border-radius:20px; white-space:nowrap; }
  .badge.legal{ background:var(--red-soft); color:var(--red); }
  .badge.warning{ background:var(--amber-soft); color:var(--amber); }
  .badge.ok{ background:var(--teal-soft); color:var(--teal); }
  .badge.info{ background:var(--blue-soft); color:var(--blue); }
  .badge.neutral{ background:var(--gray-soft); color:var(--ink-soft); }
  .check{ font-size:13px; }
  .check.yes{ color:var(--teal); font-weight:700; }
  .check.no{ color:var(--line); }
  .empty-state{ padding:36px; text-align:center; color:var(--ink-soft); }

  let filters = { frontPayout:'ALL', backPayout:'ALL' };

  const money = n => (isNaN(n)?0:n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  const moneyShort = n => Math.round(n||0).toLocaleString('en-US');
  const clipFmt = v => { const n = parseFloat(v); if(isNaN(n)) return ''; return (Math.round(n*100*100)/100) + '%'; };
  const feColorStyle = c => { if(!c) return ''; const rgba = c==='red' ? 'rgba(232,99,111,0.38)' : (c==='yellow' ? 'rgba(240,184,64,0.38)' : 'rgba(47,198,180,0.38)'); return ` style="background-color:${rgba} !important"`; };
  function escapeHtml(s){ return String(s===undefined||s===null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function checkMark(b){ const s=String(b).trim().toLowerCase(); const t=(b===true)||s==='true'||s==='yes'||s==='1'||s==='x'; return t ? '<span class="check yes">✓</span>' : '<span class="check no">–</span>'; }

  function weekOpts(field){
    const set = Array.from(new Set(JOBS.map(j=>j[field]).filter(v=>v)));
    set.sort((a,b)=>{
      const na = parseInt(String(a).replace(/\D/g,''),10), nb = parseInt(String(b).replace(/\D/g,''),10);
      if(isNaN(na)&&isNaN(nb)) return String(a).localeCompare(String(b));
      if(isNaN(na)) return 1;
      if(isNaN(nb)) return -1;
      return na-nb;
    });
    return ['ALL', ...set];
  }

  function commRowHtml(j){
    return `<tr>
      <td class="col-name">${escapeHtml(j.name)}</td><td>${escapeHtml(j.jobNumber)}</td>
      <td class="col-num">${money(j.msrp)}</td>
      <td class="col-num">${money(j.gross)}</td>
      <td style="text-align:center">${checkMark(j.referral3)}</td><td style="text-align:center">${checkMark(j.reHash1)}</td>
      <td style="text-align:center">${checkMark(j.selfGen8)}</td><td style="text-align:center">${checkMark(j.bfbCompBid1)}</td>
      <td>${clipFmt(j.clipPct)}</td>
      <td class="col-num" style="font-weight:600">${money(j.totalComm)}</td>
      <td class="col-num"${feColorStyle(j.frontEndColor)}>${money(j.frontEnd)}</td><td class="col-num"${feColorStyle(j.backEndColor)}>${money(j.backEnd)}</td>
      <td class="col-notes">${escapeHtml(j.commNotes)}</td>
      <td style="text-align:center">${escapeHtml(j.measureComplete)}</td>
      <td>${escapeHtml(j.frontEndPayout)}</td>
      <td>${escapeHtml(j.backEndPayout)}</td>
    </tr>`;
  }

  function renderStats(list, dualMode, totFrontOverride, totBackOverride){
    const totMSRP = list.reduce((a,j)=>a+(+j.msrp||0),0);
    const totGross = list.reduce((a,j)=>a+(+j.gross||0),0);
    const totComm = list.reduce((a,j)=>a+(+j.totalComm||0),0);
    const totFront = dualMode ? totFrontOverride : list.reduce((a,j)=>a+(+j.frontEnd||0),0);
    const totBack = dualMode ? totBackOverride : list.reduce((a,j)=>a+(+j.backEnd||0),0);
    const showBackCard = filters.frontPayout==='ALL' || filters.backPayout!=='ALL';
    document.getElementById('statRow').innerHTML = `
      <div class="stat-card"><div class="stat-label">Jobs</div><div class="stat-value">${list.length}</div></div>
      <div class="stat-card"><div class="stat-label">Total MSRP</div><div class="stat-value">${moneyShort(totMSRP)}</div></div>
      <div class="stat-card"><div class="stat-label">Gross $</div><div class="stat-value">${moneyShort(totGross)}</div></div>
      <div class="stat-card"><div class="stat-label">Total Comm</div><div class="stat-value pos">${moneyShort(totComm)}</div></div>
      <div class="stat-card"><div class="stat-label">Front End</div><div class="stat-value">${moneyShort(totFront)}</div></div>
      ${showBackCard ? `<div class="stat-card"><div class="stat-label">Back End</div><div class="stat-value">${moneyShort(totBack)}</div></div>` : ''}
      ${dualMode ? `<div class="stat-card"><div class="stat-label">Week Total</div><div class="stat-value pos">${moneyShort(totFront+totBack)}</div></div>` : ''}
    `;
  }

  function renderAll(){
    const dualMode = filters.frontPayout!=='ALL' && filters.backPayout!=='ALL';
    const commHead = `<tr>
      <th class="col-name">Name</th><th>Job #</th><th>MSRP</th><th>Gross $</th>
      <th>Referral 3%</th><th>Re Hash 1%</th><th>Self Gen 8%</th><th>BFB/Comp Bid 1%</th><th>Clip %</th>
      <th>Total Comm</th><th>Front End</th><th>Back End</th><th class="col-notes">Comm Notes</th><th>Measure</th><th>Front End Payout</th><th>Back End Payout</th>
    </tr>`;
    if(dualMode){
      const frontList = JOBS.filter(j=>j.frontEndPayout===filters.frontPayout);
      const backList = JOBS.filter(j=>j.backEndPayout===filters.backPayout);
      const totFront = frontList.reduce((a,j)=>a+(+j.frontEnd||0),0);
      const totBack = backList.reduce((a,j)=>a+(+j.backEnd||0),0);
      const seen = new Set();
      const union = [];
      [...frontList, ...backList].forEach(j=>{ const key = j.jobNumber||j.id; if(!seen.has(key)){ seen.add(key); union.push(j); } });
      document.getElementById('resultCount').textContent = union.length + ' of ' + JOBS.length + ' jobs';
      renderStats(union, true, totFront, totBack);
      document.getElementById('mainTableWrap').innerHTML = `
        <div style="font-weight:600; color:var(--ink-soft); margin:14px 14px 8px; text-transform:uppercase; font-size:12px; letter-spacing:.04em;">Front End Payout — ${escapeHtml(filters.frontPayout)}</div>
        <table><thead>${commHead}</thead><tbody>${frontList.length?frontList.map(commRowHtml).join(''):`<tr><td colspan="16" class="empty-state">No jobs match this week.</td></tr>`}</tbody></table>
        <div style="font-weight:600; color:var(--ink-soft); margin:18px 14px 8px; text-transform:uppercase; font-size:12px; letter-spacing:.04em;">Back End Payout — ${escapeHtml(filters.backPayout)}</div>
        <table><thead>${commHead}</thead><tbody>${backList.length?backList.map(commRowHtml).join(''):`<tr><td colspan="16" class="empty-state">No jobs match this week.</td></tr>`}</tbody></table>
      `;
    } else {
      document.getElementById('mainTableWrap').innerHTML = `<table id="jobsTable"><thead id="tableHead"></thead><tbody id="jobsBody"></tbody></table>`;
      document.getElementById('resultCount').textContent = JOBS.length + ' of ' + JOBS.length + ' jobs';
      renderStats(JOBS, false);
      document.getElementById('tableHead').innerHTML = commHead;
      document.getElementById('jobsBody').innerHTML = JOBS.length ? JOBS.map(commRowHtml).join('') : `<tr><td colspan="16" class="empty-state">No commission activity.</td></tr>`;
    }
  }

  function init(){
    const d = new Date(SNAPSHOT_DATE+'T00:00:00');
    const label = d.toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric', year:'numeric'});
    document.getElementById('snapshotLine').textContent = 'Snapshot as of ' + label + ' — updated weekly, view only';
    document.getElementById('snapshotBadge').textContent = SNAPSHOT_DATE;
    if(LOGO_DATA_URL){
      const img = document.createElement('img');
      img.src = LOGO_DATA_URL;
      img.style.height = '36px';
      document.getElementById('logoWrap').prepend(img);
    }
    const fpSel = document.getElementById('frontPayoutFilter');
    fpSel.innerHTML = weekOpts('frontEndPayout').map(m=>`<option value="${escapeHtml(m)}" ${filters.frontPayout===m?'selected':''}>${m==='ALL'?'All Front End Payout':m}</option>`).join('');
    const bpSel = document.getElementById('backPayoutFilter');
    bpSel.innerHTML = weekOpts('backEndPayout').map(m=>`<option value="${escapeHtml(m)}" ${filters.backPayout===m?'selected':''}>${m==='ALL'?'All Back End Payout':m}</option>`).join('');
    fpSel.addEventListener('change', e=>{ filters.frontPayout=e.target.value; renderAll(); });
    bpSel.addEventListener('change', e=>{ filters.backPayout=e.target.value; renderAll(); });
    renderAll();
  }
  init();
})();
</script>
</body>
</html>
