<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collections Dashboard</title>
<style>
  :root{
    color-scheme: dark;
    --bg: #0A1F1D; --panel: #123330; --ink: #F2F7F6; --ink-soft: #8FADA8; --line: #1E4A45;
    --teal: #2FC6B4; --teal-soft: rgba(47,198,180,0.16); --amber: #F0B840; --amber-soft: rgba(240,184,64,0.16);
    --red: #E8636F; --red-soft: rgba(232,99,111,0.16); --blue: #7FC7DC; --blue-soft: rgba(127,199,220,0.16); --gray-soft: #1A3E3A;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); }
  #dash-root{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; background:var(--bg); color:var(--ink); padding:24px; min-height:100vh; }
  .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  .dash-header{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:12px; }
  .dash-title{ font-family:Georgia,'Times New Roman',serif; font-weight:600; font-size:26px; letter-spacing:-0.01em; }
  .dash-sub{ color:var(--ink-soft); font-size:13px; margin-top:2px; }
  .snapshot-badge{ display:inline-block; font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; background:var(--blue-soft); color:var(--blue); padding:6px 12px; border-radius:20px; }
  .tabs{ display:flex; gap:4px; background:var(--gray-soft); padding:4px; border-radius:10px; }
  .tab-btn{ border:none; background:transparent; padding:8px 16px; border-radius:8px; font-family:inherit; font-weight:600; font-size:13px; color:var(--ink-soft); cursor:pointer; }
  .tab-btn.active{ background:var(--panel); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .stat-row{ display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:12px; margin-bottom:18px; }
  .stat-card{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .stat-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); font-weight:600; }
  .stat-value{ font-family:'Courier New',monospace; font-size:20px; font-weight:600; margin-top:4px; }
  .stat-value.pos{ color:var(--teal); } .stat-value.neg{ color:var(--red); }
  .section-label{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); font-weight:600; margin:2px 2px 8px; }
  .toolbar{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
  .toolbar input[type=text], .toolbar select{ font-family:inherit; font-size:12.5px; padding:7px 9px; border:1px solid var(--line); border-radius:8px; background:var(--panel); color:var(--ink); }
  .toolbar input[type=text]{ min-width:200px; }
  .spacer{ flex:1; }
  .result-count{ font-size:12px; color:var(--ink-soft); }
  .table-wrap{ background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:auto; max-height:640px; }
  table{ width:100%; border-collapse:collapse; font-size:12px; min-width:1400px; }
  thead th{ position:sticky; top:0; background:#0E2624; text-align:left; padding:9px 7px; font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); border-bottom:1px solid var(--line); white-space:nowrap; font-weight:600; z-index:1; }
  tbody td{ padding:7px; border-bottom:1px solid var(--line); vertical-align:top; }
  tbody tr:hover{ background:#163B36; }
  tbody tr.sev-legal{ border-left:3px solid var(--red); }
  tbody tr.sev-warning{ border-left:3px solid var(--amber); }
  tbody tr.sev-ok{ border-left:3px solid var(--teal); }
  tbody tr.sev-info{ border-left:3px solid var(--blue); }
  tbody tr.sev-neutral{ border-left:3px solid #C7CBC9; }
  .col-name{ min-width:150px; font-weight:600; } .col-notes{ min-width:190px; color:var(--ink-soft); }
  .col-num{ text-align:right; font-family:'Courier New',monospace; white-space:nowrap; }
  .baldue{ font-family:'Courier New',monospace; font-weight:600; text-align:right; white-space:nowrap; }
  .baldue.neg{ color:var(--red); }
  .badge{ display:inline-block; font-size:10px; font-weight:600; padding:2px 6px; border-radius:20px; white-space:nowrap; }
  .badge.legal{ background:var(--red-soft); color:var(--red); }
  .badge.warning{ background:var(--amber-soft); color:var(--amber); }
  .badge.ok{ background:var(--teal-soft); color:var(--teal); }
  .badge.info{ background:var(--blue-soft); color:var(--blue); }
  .badge.neutral{ background:var(--gray-soft); color:var(--ink-soft); }
  .check{ font-size:13px; }
  .check.yes{ color:var(--teal); font-weight:700; }
  .check.no{ color:var(--line); }
  .empty-state{ padding:36px; text-align:center; color:var(--ink-soft); }
</style>
</head>
<body>
<h2 class="sr-only">Collections dashboard: read-only weekly snapshot with collections and sales commission tabs, filterable by market, job status, category and priority.</h2>
<div id="dash-root">
  <div class="dash-header">
    <div style="display:flex; align-items:center; gap:12px;" id="logoWrap"><div><div class="dash-title">Collections Dashboard</div><div class="dash-sub" id="snapshotLine">Weekly snapshot</div></div></div>
    <div style="display:flex; align-items:center; gap:10px;">
      <div class="snapshot-badge" id="snapshotBadge">Snapshot</div>
      <div class="tabs">
        <button class="tab-btn active" data-tab="dashboard">Collections</button>
        <button class="tab-btn" data-tab="commissions">Commissions</button>
      </div>
    </div>
  </div>
  <div class="stat-row" id="statRow"></div>
  <div class="section-label" id="secLabel1">Balance Due by Market</div>
  <div class="stat-row" id="marketRow"></div>
  <div class="section-label" id="secLabel2">Balance Due by Age (from contract date)</div>
  <div class="stat-row" id="agingRow"></div>
  <div class="toolbar">
    <input type="text" id="searchBox" placeholder="Search name, job #, rep, notes…">
    <select id="marketFilter"></select>
    <select id="jobStatusFilter"></select>
    <select id="categoryFilter"></select>
    <select id="priorityFilter"></select>
    <select id="repFilter" style="display:none"></select>
    <div class="spacer"></div>
    <div class="result-count" id="resultCount"></div>
  </div>
  <div class="table-wrap">
    <table id="jobsTable"><thead id="tableHead"></thead><tbody id="jobsBody"></tbody></table>
  </div>
</div>

(function(){
  const SNAPSHOT_DATE = "2026-07-29";
  let activeTab = 'dashboard';
  let filters = { search:'', market:'ALL', jobStatus:'ALL', category:'ALL', priority:'ALL', rep:'ALL' };
  const money = n => (isNaN(n)?0:n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  const moneyShort = n => Math.round(n||0).toLocaleString('en-US');
  function escapeHtml(s){ return String(s===undefined||s===null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function priSeverity(p){
    p = (p||'').toLowerCase();
    if(p.includes('priority 4')) return 'legal';
    if(p.includes('priority 3')) return 'warning';
    if(p.includes('priority 2')) return 'info';
    if(p.includes('priority 1')) return 'ok';
    return 'neutral';
  }
  function catSeverity(c){
    c = (c||'').toLowerCase();
    if(c.includes('legal')) return 'legal';
    if(c==='paid in full') return 'ok';
    if(c.includes('scheduled')) return 'ok';
    if(c.includes('hoa')||c.includes('withholding')||c.includes('unresponsive')||c.includes('deposit needed')||c.includes('delayed')) return 'warning';
    if(c.includes('waiting on permit')) return 'info';
    return 'neutral';
  }
  function rowSeverity(j){ const ps = priSeverity(j.priorityLevel); return ps!=='neutral' ? ps : catSeverity(j.collectionsCategory); }
  function priLabel(p){ if(!p) return '—'; const m = p.match(/priority\s*\d/i); return m ? m[0] : p; }
  function checkMark(b){ return b ? '<span class="check yes">✓</span>' : '<span class="check no">–</span>'; }
  function daysSince(dateStr){
    if(!dateStr) return null;
    const d = new Date(dateStr+'T00:00:00');
    if(isNaN(d.getTime())) return null;
    const asOf = new Date(SNAPSHOT_DATE+'T00:00:00');
    return Math.floor((asOf-d)/86400000);
  }
  function jobSortCmp(a,b){
    const ad = a.contractDate, bd = b.contractDate;
    if(ad && bd){ if(ad!==bd) return ad<bd?1:-1; }
    else if(ad && !bd) return -1;
    else if(!ad && bd) return 1;
    return (a.name||'').localeCompare(b.name||'');
  }
  function filteredJobs(){
    return JOBS.filter(j=>{
      if(filters.market!=='ALL' && j.market!==filters.market) return false;
      if(filters.jobStatus!=='ALL' && j.jobStatus!==filters.jobStatus) return false;
      if(filters.category!=='ALL' && j.collectionsCategory!==filters.category) return false;
      if(filters.priority!=='ALL' && j.priorityLevel!==filters.priority) return false;
      if(filters.rep!=='ALL' && j.salesRep!==filters.rep) return false;
      if(filters.search){
        const s = filters.search.toLowerCase();
        if(!(j.name.toLowerCase().includes(s) || String(j.jobNumber).toLowerCase().includes(s) || (j.notes||'').toLowerCase().includes(s) || (j.salesRep||'').toLowerCase().includes(s))) return false;
      }
      return true;
    }).sort(jobSortCmp);
  }
  function opts(field, excludeBlank){
    const set = Array.from(new Set(JOBS.map(j=>j[field]).filter(v=>excludeBlank?v:true))).sort();
    return ['ALL', ...set];
  }
  function fillSelect(id, field, excludeBlank, allLabel, currentVal){
    const sel = document.getElementById(id);
    sel.innerHTML = opts(field, excludeBlank).map(m=>`<option value="${escapeHtml(m)}" ${currentVal===m?'selected':''}>${m==='ALL'?allLabel:m}</option>`).join('');
  }
  function renderStatsDashboard(list){
    const gross = list.reduce((a,j)=>a+(+j.gross||0),0);
    const paid = list.reduce((a,j)=>a+(+j.paid||0),0);
    const bal = gross-paid;
    const totalComm = list.reduce((a,j)=>a+(+j.totalComm||0),0);
    document.getElementById('statRow').innerHTML = `
      <div class="stat-card"><div class="stat-label">Jobs</div><div class="stat-value">${list.length}</div></div>
      <div class="stat-card"><div class="stat-label">Gross $</div><div class="stat-value">${moneyShort(gross)}</div></div>
      <div class="stat-card"><div class="stat-label">Total Paid</div><div class="stat-value pos">${moneyShort(paid)}</div></div>
      <div class="stat-card"><div class="stat-label">Bal Due</div><div class="stat-value ${bal>0?'neg':''}">${moneyShort(bal)}</div></div>
      <div class="stat-card"><div class="stat-label">Total Comm</div><div class="stat-value">${moneyShort(totalComm)}</div></div>
    `;
    const markets = Array.from(new Set(list.map(j=>j.market).filter(Boolean))).sort();
    document.getElementById('marketRow').innerHTML = markets.length ? markets.map(m=>{
      const mBal = list.filter(j=>j.market===m).reduce((a,j)=>a+((+j.gross||0)-(+j.paid||0)),0);
      return `<div class="stat-card"><div class="stat-label">${escapeHtml(m)}</div><div class="stat-value ${mBal>0?'neg':''}">${moneyShort(mBal)}</div></div>`;
    }).join('') : `<div class="stat-card"><div class="stat-label">—</div><div class="stat-value">0</div></div>`;
    let b0_90=0,b90_180=0,b180_360=0,bOver360=0;
    list.forEach(j=>{
      const days = daysSince(j.contractDate);
      if(days===null) return;
      const b = (+j.gross||0)-(+j.paid||0);
      if(days<90) b0_90+=b; else if(days>=90&&days<180) b90_180+=b; else if(days>=180&&days<360) b180_360+=b; else if(days>=360) bOver360+=b;
    });
    document.getElementById('agingRow').innerHTML = `
      <div class="stat-card"><div class="stat-label">0–90 Days</div><div class="stat-value ${b0_90>0?'neg':''}">${moneyShort(b0_90)}</div></div>
      <div class="stat-card"><div class="stat-label">90–180 Days</div><div class="stat-value ${b90_180>0?'neg':''}">${moneyShort(b90_180)}</div></div>
      <div class="stat-card"><div class="stat-label">180–360 Days</div><div class="stat-value ${b180_360>0?'neg':''}">${moneyShort(b180_360)}</div></div>
      <div class="stat-card"><div class="stat-label">360+ Days</div><div class="stat-value ${bOver360>0?'neg':''}">${moneyShort(bOver360)}</div></div>
    `;
    document.getElementById('secLabel1').style.display='';
    document.getElementById('secLabel2').style.display='';
    document.getElementById('marketRow').style.display='';
    document.getElementById('agingRow').style.display='';
  }
  function renderStatsCommissions(list){
    const totMSRP = list.reduce((a,j)=>a+(+j.msrp||0),0);
    const totComm = list.reduce((a,j)=>a+(+j.totalComm||0),0);
    const totFront = list.reduce((a,j)=>a+(+j.frontEnd||0),0);
    const totBack = list.reduce((a,j)=>a+(+j.backEnd||0),0);
    document.getElementById('statRow').innerHTML = `
      <div class="stat-card"><div class="stat-label">Jobs</div><div class="stat-value">${list.length}</div></div>
      <div class="stat-card"><div class="stat-label">Total MSRP</div><div class="stat-value">${moneyShort(totMSRP)}</div></div>
      <div class="stat-card"><div class="stat-label">Total Comm</div><div class="stat-value pos">${moneyShort(totComm)}</div></div>
      <div class="stat-card"><div class="stat-label">Front End</div><div class="stat-value">${moneyShort(totFront)}</div></div>
      <div class="stat-card"><div class="stat-label">Back End</div><div class="stat-value">${moneyShort(totBack)}</div></div>
    `;
    document.getElementById('secLabel1').style.display='none';
    document.getElementById('secLabel2').style.display='none';
    document.getElementById('marketRow').style.display='none';
    document.getElementById('agingRow').style.display='none';
  }
  function dashRowHtml(j){
    const bal = (+j.gross||0)-(+j.paid||0);
    const sev = rowSeverity(j);
    return `<tr class="sev-${sev}">
      <td class="col-name">${escapeHtml(j.name)}</td><td>${escapeHtml(j.jobNumber)}</td><td>${escapeHtml(j.market)}</td>
      <td>${escapeHtml(j.salesRep)}</td><td>${escapeHtml(j.contractDate)}</td><td>${escapeHtml(j.jobStatus)}</td>
      <td>${escapeHtml(j.fundingSource)}</td><td class="col-num">${money(j.msrp)}</td><td>${escapeHtml(j.pctMSRP)}</td>
      <td class="col-num">${money(j.gross)}</td><td class="col-num">${money(j.paid)}</td>
      <td class="baldue ${bal<0?'neg':''}">${money(bal)}</td>
      <td><span class="badge ${priSeverity(j.priorityLevel)}">${escapeHtml(priLabel(j.priorityLevel))}</span></td>
      <td><span class="badge ${catSeverity(j.collectionsCategory)}">${escapeHtml(j.collectionsCategory)||'—'}</span></td>
      <td>${escapeHtml(j.responsibility)}</td><td>${escapeHtml(j.nextAction)}</td>
      <td class="col-notes">${escapeHtml(j.notes)}</td>
    </tr>`;
  }
  function commRowHtml(j){
    return `<tr>
      <td class="col-name">${escapeHtml(j.name)}</td><td>${escapeHtml(j.jobNumber)}</td><td>${escapeHtml(j.salesRep)}</td>
      <td class="col-num">${money(j.msrp)}</td>
      <td class="col-num">${money(j.gross)}</td>
      <td style="text-align:center">${checkMark(j.referral3)}</td><td style="text-align:center">${checkMark(j.reHash1)}</td>
      <td style="text-align:center">${checkMark(j.selfGen8)}</td><td style="text-align:center">${checkMark(j.bfbCompBid1)}</td>
      <td>${escapeHtml(j.clipPct)}</td>
      <td class="col-num" style="font-weight:600">${money(j.totalComm)}</td>
      <td class="col-num">${money(j.frontEnd)}</td><td class="col-num">${money(j.backEnd)}</td>
      <td class="col-notes">${escapeHtml(j.commNotes)}</td><td>${escapeHtml(j.payment)}</td>
      <td style="text-align:center">${checkMark(j.measureComplete)}</td><td>${escapeHtml(j.contractReview)}</td>
    </tr>`;
  }
  function renderTabs(){
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.getAttribute('data-tab')===activeTab));
    document.getElementById('marketFilter').style.display = activeTab==='dashboard' ? '' : 'none';
    document.getElementById('jobStatusFilter').style.display = activeTab==='dashboard' ? '' : 'none';
    document.getElementById('categoryFilter').style.display = activeTab==='dashboard' ? '' : 'none';
    document.getElementById('priorityFilter').style.display = activeTab==='dashboard' ? '' : 'none';
    document.getElementById('repFilter').style.display = activeTab==='commissions' ? '' : 'none';
  }
  function renderAll(){
    const list = filteredJobs();
    document.getElementById('resultCount').textContent = list.length + ' of ' + JOBS.length + ' jobs';
    renderTabs();
    if(activeTab==='dashboard'){
      renderStatsDashboard(list);
      document.getElementById('tableHead').innerHTML = `<tr>
        <th class="col-name">Name</th><th>Job #</th><th>Market</th><th>Sales Rep</th><th>Contract Date</th>
        <th>Job Status</th><th>Funding Source</th><th>MSRP</th><th>% MSRP</th><th>Gross $</th><th>Paid</th><th>Bal Due</th>
        <th>Priority</th><th>Collections Category</th><th>Responsibility</th><th>Next Action</th><th class="col-notes">Notes</th>
      </tr>`;
      document.getElementById('jobsBody').innerHTML = list.length ? list.map(dashRowHtml).join('') : `<tr><td colspan="16" class="empty-state">No jobs match your filters.</td></tr>`;
    } else {
      renderStatsCommissions(list);
      document.getElementById('tableHead').innerHTML = `<tr>
        <th class="col-name">Name</th><th>Job #</th><th>Sales Rep</th><th>MSRP</th><th>Gross $</th>
        <th>Referral 3%</th><th>Re Hash 1%</th><th>Self Gen 8%</th><th>BFB/Comp Bid 1%</th><th>Clip %</th>
        <th>Total Comm</th><th>Front End</th><th>Back End</th><th class="col-notes">Comm Notes</th><th>Payment</th><th>Measure</th><th>Contract Rev</th>
      </tr>`;
      document.getElementById('jobsBody').innerHTML = list.length ? list.map(commRowHtml).join('') : `<tr><td colspan="16" class="empty-state">No jobs match your filters.</td></tr>`;
    }
  }
  function init(){
    const d = new Date(SNAPSHOT_DATE+'T00:00:00');
    const label = d.toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric', year:'numeric'});
    document.getElementById('snapshotLine').textContent = 'Snapshot as of ' + label + ' — updated weekly, view only';
    document.getElementById('snapshotBadge').textContent = SNAPSHOT_DATE;
    fillSelect('marketFilter','market',false,'All Markets','ALL');
    fillSelect('jobStatusFilter','jobStatus',true,'All Job Statuses','ALL');
    fillSelect('categoryFilter','collectionsCategory',true,'All Collections Categories','ALL');
    fillSelect('priorityFilter','priorityLevel',true,'All Priorities','ALL');
    fillSelect('repFilter','salesRep',true,'All Sales Reps','ALL');
    document.getElementById('searchBox').addEventListener('input', e=>{ filters.search=e.target.value; renderAll(); });
    document.getElementById('marketFilter').addEventListener('change', e=>{ filters.market=e.target.value; renderAll(); });
    document.getElementById('jobStatusFilter').addEventListener('change', e=>{ filters.jobStatus=e.target.value; renderAll(); });
    document.getElementById('categoryFilter').addEventListener('change', e=>{ filters.category=e.target.value; renderAll(); });
    document.getElementById('priorityFilter').addEventListener('change', e=>{ filters.priority=e.target.value; renderAll(); });
    document.getElementById('repFilter').addEventListener('change', e=>{ filters.rep=e.target.value; renderAll(); });
    document.querySelectorAll('.tab-btn').forEach(btn=>{ btn.addEventListener('click', ()=>{ activeTab = btn.getAttribute('data-tab'); filters.search=''; document.getElementById('searchBox').value=''; renderAll(); }); });
    renderAll();
  }
  init();
})();
</script>
</body>
</html>
